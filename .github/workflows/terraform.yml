name: Terraform CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]



jobs:
  terraform:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
          creds: ${{ secrets.ENCRYPTED_AZURE }}  

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
# READ THE PLAIN TEXT CREDENTIALS AND CONVERT THEM FOR TERRAFORM 
      - name: Parse Azure Credentials Text 
        run: | 
         echo "$CREDS" | while read -r line; do 
           if [ -n "$line" ]; then 
             # Remove any accidental double quotes and swap AZURE_ for ARM_  
             cleaned=$(echo "$line" | tr -d '"' | sed 's/AZURE_/ARM_/g') 
             echo "$cleaned" >> $GITHUB_ENV 
           fi
         done
      
      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
